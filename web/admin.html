<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseVideo — Trang điều hành</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto;
         padding: 16px; background: #111; color: #eee; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px;
    padding: 8px; border-radius: 8px; border: 1px solid #444;
    background: #222; color: #eee; font-size: 15px; }
  button { margin-top: 10px; padding: 10px 16px; border: 0; border-radius: 10px;
    background: #7c5cff; color: #fff; font-size: 15px; font-weight: 700; }
  button:disabled { opacity: .5; }
  button.run { background: #1a9e5c; }
  button.dl { background: #2563eb; }
  .hint { color: #aaa; font-size: 13px; margin-top: 4px; }
  .order { background: #1c1c1c; border-radius: 12px; padding: 12px;
    margin-top: 12px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 13px; font-weight: 700; }
  .cho_chay { background: #7a5b00; }
  .dang_chay { background: #7c5cff; }
  .done { background: #1a9e5c; }
  .failed { background: #b91c1c; }
  .scenes { color: #ccc; font-size: 14px; white-space: pre-wrap; }
  .err { color: #f87171; font-size: 13px; white-space: pre-wrap; }
  a { color: #9db4ff; }
</style>
</head>
<body>
<h1>🛠 MuseVideo — Trang điều hành</h1>
<p>Đơn tạo video gửi lên sẽ nằm đây chờ chạy. Điều hành bấm <b>Chạy</b> từng đơn, xong thì tải video giao.</p>
<p><a href="./">← Về trang gửi yêu cầu</a></p>

<label>Địa chỉ server
  <input id="server" type="text" placeholder="http://may-chu:18700">
</label>
<div class="hint">Mở trang này từ chính server thì để trống là tự nhận địa chỉ hiện tại.</div>

<label>Token điều hành
  <input id="key" type="password" placeholder="token điều hành">
</label>

<button id="refresh">Tải lại danh sách</button>
<div class="hint">Tự tải lại mỗi 5 giây.</div>
<div id="list"></div>

<script>
const $ = id => document.getElementById(id);
const serverEl = $('server'), keyEl = $('key'), listEl = $('list');
serverEl.value = localStorage.getItem('mv_server') || '';
keyEl.value = localStorage.getItem('mv_key') || '';
function base() {
  return (serverEl.value.trim() || window.location.origin).replace(/\/$/, '');
}
function headers() {
  const h = { 'Content-Type': 'application/json' };
  const k = keyEl.value.trim();
  if (k) h['X-Api-Key'] = k;
  return h;
}
const LABEL = { cho_chay: 'Chờ chạy', dang_chay: 'Đang chạy',
  done: 'Xong', failed: 'Lỗi' };
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
async function load() {
  localStorage.setItem('mv_server', serverEl.value.trim());
  localStorage.setItem('mv_key', keyEl.value.trim());
  try {
    const r = await fetch(base() + '/jobs', { headers: headers() });
    const d = await r.json();
    if (!r.ok) {
      listEl.innerHTML = '<p>Lỗi ' + r.status + ': ' + esc(d.error || '') +
        (r.status === 401 ? ' — kiểm tra lại token điều hành.' : '') + '</p>';
      return;
    }
    const orders = d.orders || [];
    if (!orders.length) { listEl.innerHTML = '<p>Chưa có đơn nào.</p>'; return; }
    listEl.innerHTML = orders.map(o => {
      const scenes = (o.scenes || []).map((s, i) =>
        (i + 1) + '. ' + esc(s.caption || '')).join('\n');
      const btns = [];
      if (o.status === 'cho_chay')
        btns.push('<button class="run" onclick="runJob(\'' + o.id +
          '\')">▶ Chạy đơn này</button>');
      if (o.status === 'done')
        btns.push('<button class="dl" onclick="dlJob(\'' + o.id +
          '\')">⬇ Tải video</button>');
      return '<div class="order"><b>Đơn ' + esc(o.id) + '</b> ' +
        '<span class="badge ' + o.status + '">' +
        (LABEL[o.status] || o.status) + '</span>' +
        '<div class="hint">' + esc(o.created || '') + ' · ' +
        esc(o.mode || '') + ' · ' + esc(o.duration || '') + ' giây/cảnh</div>' +
        '<div class="scenes">' + scenes + '</div>' +
        (o.error ? '<div class="err">' + esc(o.error) + '</div>' : '') +
        btns.join(' ') + '</div>';
    }).join('');
  } catch (e) {
    listEl.innerHTML = '<p>Không nối được server: ' + esc(e) + '</p>';
  }
}
async function runJob(id) {
  const r = await fetch(base() + '/jobs/' + id + '/run',
    { method: 'POST', headers: headers() });
  const d = await r.json();
  if (!r.ok) alert('Lỗi ' + r.status + ': ' + (d.error || ''));
  load();
}
async function dlJob(id) {
  const r = await fetch(base() + '/jobs/' + id + '/download',
    { headers: headers() });
  if (!r.ok) { alert('Chưa tải được (mã ' + r.status + ').'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'musevideo-' + id + '.mp4';
  a.click();
}
$('refresh').onclick = load;
load();
setInterval(load, 5000);
</script>
</body>
</html>
