<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseVideo — Tạo video từ kịch bản</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto;
         padding: 16px; background: #111; color: #eee; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px;
    padding: 8px; border-radius: 8px; border: 1px solid #444;
    background: #222; color: #eee; font-size: 15px; }
  textarea { min-height: 140px; }
  button { margin-top: 14px; padding: 12px 20px; border: 0; border-radius: 10px;
    background: #7c5cff; color: #fff; font-size: 16px; font-weight: 700; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row label { margin-top: 0; }
  #status { margin-top: 16px; white-space: pre-wrap; background: #1c1c1c;
    border-radius: 10px; padding: 12px; min-height: 60px; }
  .hint { color: #aaa; font-size: 13px; margin-top: 4px; }
  a { color: #9db4ff; }
</style>
</head>
<body>
<h1>🎬 MuseVideo</h1>
<p>Tạo video dọc từ kịch bản — ảnh + video do Muse AI sinh, ráp sẵn phụ đề.</p>

<label>Địa chỉ server
  <input id="server" type="text" placeholder="http://may-chu:18700">
</label>
<div class="hint">Mở tool từ chính server thì để trống là tự nhận địa chỉ hiện tại.</div>

<label>Token riêng của bộ tool
  <input id="key" type="password" placeholder="dán token riêng vào đây">
</label>
<div class="hint">Token này lưu trên trình duyệt của bạn thôi, không gửi đi đâu khác ngoài server tool.</div>

<label>Kịch bản — mỗi dòng một cảnh, dạng: lời thoại | prompt tiếng Anh
  <textarea id="script" placeholder="Khỉ và Rùa đi dạo | A cute monkey and a turtle walking together in a sunny garden, 2D animation style, vertical video
Ếch nhảy trên lá sen | A cute frog jumping happily on a lotus leaf in a pond, 2D animation style, vertical video"></textarea>
</label>

<div class="row">
  <label>Số giây mỗi cảnh <input id="duration" type="number" value="5" min="1" max="60" style="width:80px"></label>
  <label><input id="testmode" type="checkbox" checked> Chế độ test (clip mẫu, không gọi Muse)</label>
</div>

<button id="create">Tạo video</button>
<button id="download" style="display:none">⬇ Tải video về máy</button>
<a id="adminlink" href="#" style="display:none; margin-left: 12px;">Mở trang điều hành →</a>
<div id="status">Chưa có job nào.</div>

<script>
const $ = id => document.getElementById(id);
const serverEl = $('server'), keyEl = $('key'), scriptEl = $('script'),
      durEl = $('duration'), testEl = $('testmode'),
      createBtn = $('create'), dlBtn = $('download'), statusEl = $('status');
serverEl.value = localStorage.getItem('mv_server') || '';
keyEl.value = localStorage.getItem('mv_key') || '';
function base() {
  return (serverEl.value.trim() || window.location.origin).replace(/\/$/, '');
}
function headers() {
  const h = { 'Content-Type': 'application/json' };
  const k = keyEl.value.trim();
  if (k) h['X-Api-Key'] = k;
  return h;
}
function say(t) { statusEl.textContent = t; }
let timer = null, jobId = null;
createBtn.onclick = async () => {
  const lines = scriptEl.value.split('\n').map(s => s.trim()).filter(Boolean);
  const scenes = [];
  for (const line of lines) {
    const i = line.indexOf('|');
    if (i < 0) { say('Mỗi dòng phải có dạng: lời thoại | prompt tiếng Anh'); return; }
    scenes.push({ caption: line.slice(0, i).trim(), prompt: line.slice(i + 1).trim() });
  }
  if (!scenes.length) { say('Nhập ít nhất 1 cảnh.'); return; }
  localStorage.setItem('mv_server', serverEl.value.trim());
  localStorage.setItem('mv_key', keyEl.value.trim());
  createBtn.disabled = true; dlBtn.style.display = 'none';
  say('Đang tạo job...');
  try {
    const r = await fetch(base() + '/jobs', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ scenes, duration: parseInt(durEl.value) || 5,
        mode: testEl.checked ? 'test-clips' : 'gateway' })
    });
    const d = await r.json();
    if (!r.ok) { say('Lỗi ' + r.status + ': ' + (d.error || 'không tạo được job') +
      (r.status === 401 ? ' — kiểm tra lại token riêng.' : '')); createBtn.disabled = false; return; }
    jobId = d.id;
    const al = $('adminlink');
    al.href = base() + '/admin';
    al.style.display = 'inline';
    say('Đã gửi đơn ' + jobId + ' lên trang điều hành. Chờ điều hành bấm chạy...');
    clearInterval(timer);
    timer = setInterval(poll, 3000);
  } catch (e) { say('Không nối được server: ' + e); createBtn.disabled = false; }
};
async function poll() {
  try {
    const r = await fetch(base() + '/jobs/' + jobId, { headers: headers() });
    const d = await r.json();
    const LM = { cho_chay: 'Chờ điều hành chạy', dang_chay: 'Đang chạy',
      done: 'Xong', failed: 'Lỗi' };
    let t = 'Đơn ' + jobId + '\nTrạng thái: ' + (LM[d.status] || d.status);
    if (Array.isArray(d.scenes)) {
      t += '\n' + d.scenes.map((s, i) => (s.status === 'done' ? '✓' : '…') +
        ' Cảnh ' + (i + 1) + ': ' + (s.caption || '')).join('\n');
    }
    if (d.error) t += '\nLỗi: ' + d.error;
    say(t);
    if (d.status === 'done') {
      clearInterval(timer); createBtn.disabled = false; dlBtn.style.display = 'inline-block';
    } else if (d.status === 'failed') {
      clearInterval(timer); createBtn.disabled = false;
    }
  } catch (e) { say('Lỗi khi hỏi tiến trình: ' + e); }
}
dlBtn.onclick = async () => {
  say('Đang tải video...');
  const r = await fetch(base() + '/jobs/' + jobId + '/download', { headers: headers() });
  if (!r.ok) { say('Chưa tải được (mã ' + r.status + ').'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'musevideo-' + jobId + '.mp4';
  a.click();
  say('Đã tải xong. Mở file trong thư viện để xem.');
};
</script>
</body>
</html>
